# The suite has two halves. One runs anywhere. The other dials a real sapedb
# daemon, and it is the half that catches what unit tests on either side
# cannot: the two implementations agreeing with themselves while disagreeing
# with each other.
#
# That second half is guarded by SAPEDB_SERVER_BIN, and until this file existed
# nothing set it. The tests were not failing; they were being skipped, and a
# skipped test reads exactly like a passing one in the summary line. Two of
# them had been pinning behaviour the server had already changed -- one of them
# asserting a bug as though it were the contract -- and neither said a word.
#
# So the daemon job ends by failing when anything is skipped. A guard that can
# be silently switched off is not a guard.
name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    name: without a server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: yarn install --frozen-lockfile
      - run: yarn test

  against-a-real-daemon:
    name: against a real daemon
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Cloned OUTSIDE the workspace on purpose. actions/checkout can only
      # place a repository inside it, and this repository has a guard that
      # walks its whole tree for a name it renamed away from. A second
      # project's source sitting in .server/ trips that guard -- correctly:
      # the guard is not wrong about what it found, the checkout was wrong
      # about where to put it.
      - name: Clone the server this client claims to speak to
        run: git clone --depth 1 https://github.com/sapedb/sapedb "$RUNNER_TEMP/server"

      - uses: actions/setup-go@v6
        with:
          go-version-file: ${{ runner.temp }}/server/go.mod
          cache-dependency-path: ${{ runner.temp }}/server/go.sum

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Build the daemon and the command line
        working-directory: ${{ runner.temp }}/server
        run: |
          go build -o "$RUNNER_TEMP/sapedbd" ./cmd/sapedbd
          go build -o "$RUNNER_TEMP/sapedb" ./cmd/sapedb

      - run: yarn install --frozen-lockfile

      - name: Run every test, including the ones that need a server
        env:
          SAPEDB_SERVER_BIN: ${{ runner.temp }}/sapedbd
          SAPEDB_CLI_BIN: ${{ runner.temp }}/sapedb
        # pipefail, because without it the exit status is tee's and a failing
        # suite reports success. And the skip count is checked here rather than
        # in a later step: a run that dies before printing its summary leaves
        # no count to read, and a missing count must not read as zero.
        run: |
          set -o pipefail
          yarn test | tee "$RUNNER_TEMP/report.txt"
          skipped=$(grep -E '^# skipped ' "$RUNNER_TEMP/report.txt" | awk '{print $3}')
          if [ -z "$skipped" ]; then
            echo "::error::the run printed no skip count at all, so nothing here can be trusted."
            exit 1
          fi
          echo "skipped: $skipped"
          if [ "$skipped" != "0" ]; then
            echo "::error::$skipped test(s) were skipped in the job whose whole purpose is to run them."
            exit 1
          fi
